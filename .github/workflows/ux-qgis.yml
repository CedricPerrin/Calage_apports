name: UX QGIS

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-qgis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  noyau:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt pytest
      - name: Identité ISL adoptée
        run: python tools/check_isl_identity.py
      - run: python calage_apports/noyau.py
      - run: python -m pytest src/test_installation_cible.py src/test_recherche_python.py src/test_projet_hecras.py src/test_lexique.py src/test_calcul_accents.py -q

  qgis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # QGIS 3.44 LTR et QGIS 4.2, Qt 6 (veille du 27/10/2026, P7).
        image: ["qgis/qgis:3.44", "qgis/qgis:4.2"]
    container:
      image: ${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
      QGIS_PREFIX_PATH: /usr
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances de test, sans h5py dans QGIS
        # Les paquets Debian de l'image (pyproj…) ne se désinstallent pas : pip les garde tels
        # quels et choisit des versions compatibles du reste (constat du 27/10/2026).
        run: |
          python3 -m pip freeze > /tmp/systeme.txt
          python3 -m pip install --break-system-packages -c /tmp/systeme.txt pytest -r requirements-dev.txt
      - name: Version réellement éprouvée
        run: python3 -c "from qgis.core import Qgis; from qgis.PyQt.QtCore import QT_VERSION_STR; print('QGIS', Qgis.QGIS_VERSION, 'Qt', QT_VERSION_STR)"
      - name: Tâche native et cycle du dialogue
        run: python3 -m pytest src/test_installation_qgis.py -v --junitxml=artifacts/tache-qgis.xml
      - name: Contrat du worker
        run: python3 -m pytest src/test_installation_cible.py src/test_installation_tache.py -v --junitxml=artifacts/worker.xml
      - name: Banc du plugin sans modèle externe
        run: python3 src/test_plugin_qgis.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recette-qgis-${{ strategy.job-index }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
