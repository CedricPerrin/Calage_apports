name: UX QGIS

# UN SEUL DECLENCHEMENT PAR POUSSEE (11/11/2026). Avec « push » sur toutes les
# branches, une branche qui a une PR jouait le workflow deux fois (push et
# pull_request) : huit jobs au lieu de quatre, et le quota de minutes Actions du
# compte y est passe. Une branche SANS PR n'est plus jouee d'office : ouvrir la
# PR (meme en brouillon) ou lancer le workflow a la main (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-qgis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  noyau:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt pytest
      - name: Identité ISL adoptée
        run: python tools/check_isl_identity.py
      - run: python calage_apports/noyau.py
      - run: python -m pytest src/test_installation_cible.py src/test_recherche_python.py src/test_projet_hecras.py src/test_lexique.py src/test_calcul_accents.py -q
      # Bancs embarqués de la chaîne qui n'exigent que requirements-dev.txt (ni h5py ni
      # ras-commander). Chacun sort en code 1 sur un [ECHEC] : éprouvé par une faute injectée.
      - name: Bancs de la chaîne
        run: |
          for banc in criteres calage controle_donnees suivi livrables parametres; do
            echo "=== src/$banc.py"
            python src/$banc.py
          done
      # Filet des trois contrôles de controle_donnees.py : 143 cas figés dans
      # src/reference_controle_donnees.json (chantier B, 10/11/2026).
      - run: python -m pytest src/test_controle_donnees.py -q
      # Saisies fautives qui levaient une exception brute : elles doivent rendre une
      # anomalie ou une réponse ok:false (correctif du 11/11/2026).
      - run: python -m pytest src/test_exceptions_brutes.py -q
      # Filets de caler() (57 scénarios ModeleFictif) et de diagnostiquer() (94 scénarios et un
      # lot de 400 entrées), figés au bit près le 10/11/2026. Hors du socle où la
      # référence a été figée, ils comparent en mode de repli, et le disent.
      - run: python -m pytest src/test_caracterisation_caler.py src/test_caracterisation_diagnostic.py -q
      # Filets de la vague 3 (10/11/2026) : les deux fonctions de classeur du noyau (64 cas)
      # et commande_caler du pont (98 cas, pilote et caler() doublés).
      - run: python -m pytest src/test_noyau_classeur.py src/test_pont_caler.py -q
      # Ce que l'import des hydrogrammes DOIT faire quand la source est plus courte ou trouée
      # (correctif du 11/11/2026 : la queue de l'ancien hydrogramme restait dessous).
      - run: python -m pytest src/test_import_hydrogrammes.py -q
      - run: python -m pytest src/test_defauts_mineurs.py -q
      # Les refus de la composition, sortis de la fenêtre vers noyau.py (11/11/2026) : sans QGIS.
      - run: python -m pytest src/test_refus_composition.py -q
      # Le lancement avant le sous-processus, sorti de la fenêtre vers noyau.py (11/11/2026) : sans QGIS.
      - run: python -m pytest src/test_lancement_noyau.py -q
      # Un échec d'écriture ne doit pas laisser le dossier sans classeur (correctif du 11/11/2026).
      - run: python -m pytest src/test_classeur_perdu.py -q
      # Filet de la chaîne des livrables (vague 5, 10/11/2026) : 39 cas, contenu des figures,
      # classeurs cellule par cellule, note de synthèse. Ni h5py ni ras-commander.
      - run: python -m pytest src/test_livrables_chaine.py -q

  chaine-hdf:
    # Hors QGIS, à dessein : h5py entre en conflit avec la bibliothèque HDF5 de QGIS
    # (voir requirements-dev.txt), donc ces deux bancs ne rejoignent pas le job « qgis ».
    # pilote_hecras.py n'est PAS joué ici : 6 de ses contrôles échouent hors Windows (CRLF,
    # compute_plan, processus Windows), ce qui ferait rougir la CI sans défaut du code.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Version minimale annoncée par le plugin : noyau.RAS_COMMANDER_MINIMUM.
      - run: python -m pip install -r requirements-dev.txt "ras-commander>=0.99" h5py
      - run: python src/geometrie.py
      - run: python src/pont_hecras.py autotest
      # Filets de la vague 4 (10/11/2026) qui demandent h5py ou ras-commander : les trois
      # lecteurs du pont (HDF fabriqués) et le recadencement des apports du pilote.
      - run: python -m pip install pytest
      - run: python -m pytest src/test_pont_lecture.py src/test_pilote_recadence.py src/test_lecture_hdf.py src/test_recadencage_ecart.py src/test_defauts_mineurs.py src/test_exceptions_brutes.py -q

  qgis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # QGIS 3.44 LTR et QGIS 4.2, Qt 6 (veille du 27/10/2026, P7).
        # QGIS 3.34 : LE MINIMUM QUE metadata.txt DECLARE (11/11/2026). Le banc
        # du plugin ne tournait plus sous cette version et personne ne le
        # voyait : sans elle dans la matrice, la promesse n'etait gardee par rien.
        image: ["qgis/qgis:3.34", "qgis/qgis:3.44", "qgis/qgis:4.2"]
    container:
      image: ${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
      QGIS_PREFIX_PATH: /usr
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances de test, sans h5py dans QGIS
        # Les paquets Debian de l'image (pyproj…) ne se désinstallent pas : pip les garde tels
        # quels et choisit des versions compatibles du reste (constat du 27/10/2026).
        run: |
          python3 -m pip freeze > /tmp/systeme.txt
          python3 -m pip install --break-system-packages -c /tmp/systeme.txt pytest -r requirements-dev.txt
      - name: Version réellement éprouvée
        run: python3 -c "from qgis.core import Qgis; from qgis.PyQt.QtCore import QT_VERSION_STR; print('QGIS', Qgis.QGIS_VERSION, 'Qt', QT_VERSION_STR)"
      - name: Tâche native et cycle du dialogue
        run: python3 -m pytest src/test_installation_qgis.py -v --junitxml=artifacts/tache-qgis.xml
      - name: Contrat du worker
        run: python3 -m pytest src/test_installation_cible.py src/test_installation_tache.py -v --junitxml=artifacts/worker.xml
      - name: Filet de la peinture du suivi
        run: python3 -m pytest src/test_peinture_suivi.py -v --junitxml=artifacts/peinture-suivi.xml
      - name: Alertes du suivi (désaccord de dossier, état illisible)
        run: python3 -m pytest src/test_alertes_suivi.py -v --junitxml=artifacts/alertes-suivi.xml
      - name: Raccord de la fenêtre aux refus de composition de noyau.py
        run: python3 -m pytest src/test_composition_fenetre.py -v --junitxml=artifacts/composition-fenetre.xml
      - name: Filet du lancement au bord de noyau.py
        run: python3 -m pytest src/test_lancement_fenetre.py -v --junitxml=artifacts/lancement-fenetre.xml
      - name: Banc du plugin sans modèle externe
        run: python3 src/test_plugin_qgis.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recette-qgis-${{ strategy.job-index }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
